services:
  mongodb:
    image: mongo
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=hend
      - MONGO_INITDB_ROOT_PASSWORD=hend
    networks:
      - microservices-net

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - mongo_data:/data/db
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=hend
      - ME_CONFIG_MONGODB_ADMINPASSWORD=hend
      - ME_CONFIG_MONGODB_SERVER=mongodb
    depends_on:
      - mongodb
    networks:
      - microservices-net

  sonarqube:
    image: sonarqube:lts
    container_name: sonar
    ports:
      - "9000:9000"
    environment:
      - SONARQUBE_JDBC_URL=jdbc:postgresql://postgres_db/sonarqube
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - microservices-net
    depends_on:
      - postgres_db

  nexus:
    image: sonatype/nexus3
    container_name: nexuss
    ports:
      - "8082:8081"
    volumes:
      - nexus_data:/nexus-data
    networks:
      - microservices-net

  mysql:
    image: mysql:latest
    container_name: mysql_db
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=EquipeDB
      - MYSQL_USER=hend
      - MYSQL_PASSWORD=hend
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - microservices-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      - PMA_HOST=mysql_db
      - PMA_USER=hend
      - PMA_PASSWORD=hend
    ports:
      - "8083:80"
    depends_on:
      - mysql
    networks:
      - microservices-net

  postgres_db:
    image: postgres:latest
    container_name: postgres_db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonarqube
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-net

  frontend:
    image: frontendimage
    container_name: frontend_container
    ports:
      - "8088:80"
    networks:
      - microservices-net
    volumes:
      - frontend_data:/app/data

  eureka:
    image: steeltoeoss/eureka-server
    container_name: eureka_server
    ports:
      - "8761:8761"
    networks:
      - microservices-net

  projetmicroservie:
    image: projetmicroserviceimage
    container_name: projet_microservice_container
    ports:
      - "8086:8086"
    networks:
      - microservices-net
    volumes:
      - projetmicroservice_data:/data
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=mongodb
    depends_on:
      - mongo-express
      - mongodb
      - api_gateway

  equipemicroservie:
    image: equipemicroserviceimage
    container_name: equipe_microservice_container
    ports:
      - "8084:8084"
    volumes:
      - equipemicroservice_data:/data
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql_db:3306/EquipeDB
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka_server:8761/eureka/
    depends_on:
      - mysql
      - eureka
      - phpmyadmin
      - api_gateway
    networks:
      - microservices-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - microservices-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - microservices-net

  config-server:
    image: config-server
    container_name: config_server
    ports:
      - "8887:8887"
    networks:
      - microservices-net

  api_gateway:
    image: kong:latest
    container_name: api_gateway
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    environment:
      - KONG_DATABASE=off
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
      - KONG_DECLARATIVE_CONFIG=/kong/kong.yml
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    networks:
      - microservices-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8089:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - microservices-net

networks:
  microservices-net:
    external: true

volumes:
  mongo_data:
    external: true
  sonarqube_data:
    external: true
  sonarqube_extensions:
    external: true
  sonarqube_logs:
    external: true
  nexus_data:
    external: true
  mysql_data:
    external: true
  postgres_data:
    external: true
  frontend_data:
    external: true
  projetmicroservice_data:
    external: true
  equipemicroservice_data:
    external: true
  prometheus_data:
    external: true
  grafana_data:
    external: true
