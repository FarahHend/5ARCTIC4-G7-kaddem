global:
  scrape_interval: 15s 

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ['localhost:9090']

  - job_name: "jenkins"
    metrics_path: "/prometheus"
    static_configs:
      - targets: ['192.168.33.10:8080']

  - job_name: "node_exporter"
    static_configs:
      - targets: ['192.168.33.10:9100']

  - job_name: "cadvisor"
    static_configs:
      - targets: ['cadvisor:8080']
